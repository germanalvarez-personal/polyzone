[tool.poetry]
name = "polyzone"
version = "0.1.0"
description = "Command-line tool for creating and managing polygon zones with rich metadata."
authors = ["Polyzone Developers <dev@polyzone.local>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "polyzone", from = "src" },
    { include = "ui", from = "src" },
    { include = "core", from = "src" },
    { include = "tools" },
]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
opencv-python = "^4.10.0.84"
shapely = "^2.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
polyzone = "polyzone.cli:app"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
